name: Check benchmark freshness

on:
  schedule:
    - cron: '24,54 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: github.repository == 'MauroDruwel/NIMStats' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check public benchmark health
        run: |
          response=$(curl --silent --show-error --max-time 20 https://nimstats.maurodruwel.be/api/health)
          printf '%s\n' "$response" | jq '{status, latest_complete_run_at, age_seconds}'
          if ! printf '%s\n' "$response" | jq -e '.status == "ok" and (.latest_complete_run_at | type == "string")' >/dev/null; then
            echo '::error::The public API did not report fresh benchmark data.'
            exit 1
          fi
