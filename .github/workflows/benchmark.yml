name: Benchmark NVIDIA NIM Models

on:
  workflow_dispatch:

jobs:
  test_group1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Test model group 1
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group1
        run: python3 scripts/test_models.py
      
      - name: Upload group1 results
        uses: actions/upload-artifact@v7
        with:
          name: results-group1
          path: scripts/results.json
          retention-days: 1

  test_group2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Test model group 2
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group2
        run: python3 scripts/test_models.py
      
      - name: Upload group2 results
        uses: actions/upload-artifact@v7
        with:
          name: results-group2
          path: scripts/results.json
          retention-days: 1

  merge_and_update:
    needs: [test_group1, test_group2]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: scripts/
      
      - name: Merge results and update history
        run: |
          mv scripts/results-group1/results.json scripts/results-group1.json || true
          mv scripts/results-group2/results.json scripts/results-group2.json || true
          python3 scripts/merge_results.py
      
      - name: Fetch and update Artificial Analysis intelligence scores
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python3 scripts/update_intelligence.py

      - name: Generate top model endpoint
        run: python3 scripts/generate_best.py
      
      - name: Open or update PR with results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- history.db top/; then
            echo "::notice::No result changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C chore/benchmark-results
          git add history.db top/
          git commit -m "Update benchmark results"
          git push --force origin HEAD:chore/benchmark-results
          PR_NUM=$(gh pr list --head chore/benchmark-results --json number -q '.[0].number')
          if [ -n "$PR_NUM" ]; then
            gh pr edit "$PR_NUM" --title "Update benchmark results" \
              --body "Automated benchmark results. See the [dashboard](https://nimstats.maurodruwel.be/)."
          else
            gh pr create --base main --head chore/benchmark-results \
              --title "Update benchmark results" \
              --body "Automated benchmark results. See the [dashboard](https://nimstats.maurodruwel.be/)."
          fi
