name: Benchmark NVIDIA NIM Models

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || (github.repository == 'MauroDruwel/NIMStats' && '879f04f8f58e18fb6de847adee291172') }}
  CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || secrets.CLOUDFLARE_D1_DATABASE_ID || (github.repository == 'MauroDruwel/NIMStats' && 'f1f8a2eb-6359-4940-8eaf-7430a9654ff5') }}

jobs:
  preflight:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: nimstats-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check benchmark configuration and D1 access
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$NIM_API_KEY" ]; then
            echo '::error::NIM_API_KEY is required for the benchmark.'
            exit 1
          fi
          python3 scripts/push_run_to_d1.py --check

  test_group1:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Test model group 1
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group1
        run: python3 scripts/test_models.py
      
      - name: Upload group1 results
        uses: actions/upload-artifact@v7
        with:
          name: results-group1
          path: scripts/results.json
          retention-days: 1

  test_group2:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Test model group 2
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MODEL_GROUP: group2
        run: python3 scripts/test_models.py
      
      - name: Upload group2 results
        uses: actions/upload-artifact@v7
        with:
          name: results-group2
          path: scripts/results.json
          retention-days: 1

  merge_and_update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [test_group1, test_group2]
    runs-on: ubuntu-latest
    environment: nimstats-production
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Download all results
        uses: actions/download-artifact@v8
        with:
          path: scripts/
      
      - name: Merge results and push to Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NIMSTATS_BENCHMARK_D1_WRITE: '1'
        run: |
          mv scripts/results-group1/results.json scripts/results-group1.json
          mv scripts/results-group2/results.json scripts/results-group2.json
          python3 scripts/merge_results.py
      
      - name: Fetch and update Artificial Analysis intelligence scores
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/update_intelligence.py

      - name: Generate top model endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/generate_best.py
      
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add top/
          if ! git diff --cached --quiet; then
            git commit -m "Update benchmark results"
            git push
          else
            echo "No generated ranking changes to commit"
          fi
